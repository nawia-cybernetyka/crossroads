[package]
name = "crossroads"
version = "0.1.0"
description = "Nawia Crossroads Utility — firmware updater and card manager for Nawia Cybernetyka pedals"
authors = ["Nawia Cybernetyka"]
license = "MIT"
repository = "https://github.com/nawia-cybernetyka/crossroads"
edition = "2024"
rust-version = "1.90"

[lib]
name = "crossroads_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.4" }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.12.5" }
tauri-plugin-log = "2"
# The two native transports. hidapi talks to the Teensy's HalfKay bootloader
# (no picker, unlike WebHID); serialport talks to the running firmware and
# sends the 134-baud reboot request. Neither needs a system library on macOS.
hidapi = "2"
serialport = { version = "4", default-features = false }
